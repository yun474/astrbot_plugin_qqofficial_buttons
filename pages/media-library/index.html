<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>素材库</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="page">
      <header class="topbar">
        <div>
          <span class="eyebrow">QQ MEDIA LIBRARY</span>
          <h1>素材库</h1>
          <p>上传到 QQ 官方图床后得到素材链接，可直接填进菜单图片，无需公网地址。</p>
        </div>
        <div class="top-actions">
          <select id="bot-select" class="hidden" aria-label="选择机器人"></select>
          <button type="button" id="refresh">刷新</button>
        </div>
      </header>

      <section class="panel">
        <div class="panel-heading">
          <div>
            <h2>QQ 素材库 <span class="quota" id="quota">已用 - / 100</span></h2>
            <small>链接只对上传它的机器人有效；90 天内没被消息使用会自动过期，每次使用重新计时。</small>
          </div>
          <div>
            <input id="upload-input" type="file" accept="image/png,image/jpeg,image/gif,image/webp" hidden />
            <button type="button" class="primary" id="upload">＋ 上传图片</button>
          </div>
        </div>
        <div class="grid" id="media-grid"></div>
        <div class="empty hidden" id="media-empty">素材库还没有图片，点右上角上传一张吧。</div>
        <button type="button" class="more hidden" id="more">加载更多</button>
      </section>

      <section class="panel">
        <div class="panel-heading">
          <div>
            <h2>本机图片</h2>
            <small>把图片放进下面的文件夹，菜单里填 <code>local://文件名</code>。每次发送时临时上传、发完即删，不长期占用素材库额度。</small>
          </div>
        </div>
        <div class="path">
          <code id="local-dir">-</code>
          <button type="button" id="copy-dir">复制路径</button>
        </div>
        <div class="grid" id="local-grid"></div>
        <div class="empty hidden" id="local-empty">文件夹里还没有图片（支持 png、jpg、gif、webp，单张 10MB 以内）。</div>
      </section>
    </main>

    <div class="confirm-overlay hidden" id="confirm-overlay" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
      <div class="confirm-card">
        <h3 id="confirm-title">确认删除</h3>
        <p id="confirm-message"></p>
        <div class="confirm-actions">
          <button type="button" id="confirm-cancel">取消</button>
          <button type="button" class="primary" id="confirm-accept">删除</button>
        </div>
      </div>
    </div>
    <div class="toast" id="toast" role="status"></div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
